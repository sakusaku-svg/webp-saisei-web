<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WebP Player</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font: 15px -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas, #fallback { max-width: 100%; max-height: 100%; object-fit: contain; }
  #fallback { display: none; }
  #bar { padding: 12px 16px; display: grid; gap: 10px; background: #111; }
  .row { display: flex; gap: 10px; align-items: center; }
  button, label.btn { flex: 1; padding: 12px; border: 0; border-radius: 10px; background: #2a2a2e;
    color: #fff; font: inherit; text-align: center; }
  button:active, label.btn:active { background: #3a3a40; }
  input[type=file] { display: none; }
  input[type=range] { flex: 1; }
  #info { font-size: 12px; color: #999; min-height: 1.4em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1" height="1"></canvas>
  <img id="fallback" alt="">
</div>
<div id="bar">
  <div id="info">WebPアニメを選択してください</div>
  <div class="row">
    <label class="btn">ファイルを選択<input id="file" type="file" accept="image/webp,image/*"></label>
    <button id="toggle" disabled>一時停止</button>
  </div>
  <div class="row"><span>速度</span><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="speedLabel">1x</span></div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: true });
const fallback = $('fallback'), info = $('info'), toggle = $('toggle');

let frames = [];      // {bitmap, duration(ms)}
let playing = false, rafId = 0, idx = 0, nextAt = 0, speed = 1;

function stop() { cancelAnimationFrame(rafId); rafId = 0; playing = false; }
function release() { stop(); frames.forEach(f => f.bitmap.close()); frames = []; }

function tick(now) {
  if (!playing) return;
  if (now >= nextAt) {
    // 遅れた分は複数フレームまとめて進めて、再生速度を保つ
    let guard = frames.length;
    do {
      const f = frames[idx];
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(f.bitmap, 0, 0);
      nextAt = (nextAt || now) + f.duration / speed;
      idx = (idx + 1) % frames.length;
    } while (nextAt <= now && guard-- > 0);
    if (nextAt < now - 200) nextAt = now; // 長時間停止後のリセット
  }
  rafId = requestAnimationFrame(tick);
}

function play() {
  if (!frames.length || playing) return;
  playing = true; nextAt = 0;
  rafId = requestAnimationFrame(tick);
  toggle.textContent = '一時停止';
}
function pause() { stop(); toggle.textContent = '再生'; }

async function load(file) {
  release();
  fallback.style.display = 'none'; cv.style.display = '';
  toggle.disabled = true;

  if (!('ImageDecoder' in window)) return useFallback(file, 'ImageDecoder非対応: imgで再生');

  info.textContent = 'デコード中…';
  try {
    const decoder = new ImageDecoder({ data: await file.arrayBuffer(), type: file.type || 'image/webp' });
    await decoder.tracks.ready;
    const count = decoder.tracks.selectedTrack.frameCount;
    for (let i = 0; i < count; i++) {
      const { image } = await decoder.decode({ frameIndex: i });
      // duration はマイクロ秒。未指定時は100ms
      const duration = image.duration ? image.duration / 1000 : 100;
      const bitmap = await createImageBitmap(image);
      if (i === 0) { cv.width = bitmap.width; cv.height = bitmap.height; }
      image.close();
      frames.push({ bitmap, duration: Math.max(duration, 10) });
      info.textContent = `デコード中… ${i + 1}/${count}`;
      if (i === 0) ctx.drawImage(bitmap, 0, 0);
    }
    decoder.close();
    const total = frames.reduce((s, f) => s + f.duration, 0);
    info.textContent = `${cv.width}×${cv.height} / ${frames.length}フレーム / ${(frames.length / total * 1000).toFixed(1)}fps平均 / canvas再生`;
    toggle.disabled = false;
    idx = 0; play();
  } catch (e) {
    console.error(e);
    useFallback(file, 'デコード失敗: imgで再生');
  }
}

function useFallback(file, msg) {
  cv.style.display = 'none';
  fallback.style.display = 'block';
  fallback.src = URL.createObjectURL(file);
  info.textContent = msg;
}

$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) load(f); });
toggle.addEventListener('click', () => playing ? pause() : play());
$('speed').addEventListener('input', e => { speed = +e.target.value; $('speedLabel').textContent = speed + 'x'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
</script>
</body>
</html>
